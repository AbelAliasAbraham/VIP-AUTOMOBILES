<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8_general_ci"/>
	<title>Vehicle Service Form</title>
	<style type="text/css">
			body
		{
			background-image: url('https://st2.depositphotos.com/2107825/9253/v/950/depositphotos_92531500-stock-illustration-car-or-bike-workshop-logo.jpg');
			background-repeat: no-repeat;
			background-size: 1500px 600px;
		}
</style>
</head>
<body>

<fieldset>
<legend><font face="American Typewriter" size="2" color="white">Vehicle Service Form</legend>
<form name="" method="" action="">
<center><table border=0>
       <hr size=3 color = blue>
      <tr>
       <td><font size ="4" color = "#FF8000"><label>
         Customer Name:</label></td>
        <td>
       <input type='text' name='txtName' id='txtName' required>
        </td>
        <td>
       </tr>
         <tr>
           <td><font size ="4" color = "#FF8000"><label>
             Vehicle Registration NO:</label></td>
        <td>
       <input type='text' name='txtregistration' id='txtregistration' required>
        </td>
        <td>
         </tr>
         <tr>
           <td><font size ="4" color = "#FF8000"><label>
       Vehicle Company:
        </label></td>
           <td>
       <input type='text' name='txtcompany' id='txtcompany' required>
        </td>
         </tr>
         <tr>
           <td><font size ="4" color = "#FF8000"><label>
             Model:
           </label></td>
           <td>
           <input type='text' name='txtmodel' id='txtmodel' required></td>
         </tr>
			<tr>
           <td><font size ="4" color = "#FF8000"><label>
             Chasis No:
           </label></td>
           <td>
           <input type='text' name='txtchasis' id='txtchasis' required></td>
         </tr>
       <tr>	<td><font size ="4" color = "#FF8000"><label>Date of Manufacture:
       </label></td>
        <td><font size ="4" color = "#FF8000"><label>
      <input type='date' name='txtdate' id='txtdate' required>
        </td>
        <td>
         </tr>
          <tr>
            <td><font size ="4" color = "#FF8000"><label>
				Phone No:
     		</label></td>
           <td>
        <input type='text' name='txtphone' id='txtphone' required>
             </td>
         </tr> 
             
       <tr>
<td>
  <center>
    <input type='submit' name='submit' value='submit' onclick="validateForm()">
<td>
  <center>
    <input type="reset" name="Reset" id="Reset" value="Reset"></center></td>
</tr>
  
</center>
      
       </table>
         
     </form>
     
     
</fieldset>
</center>
<script>
    function validateForm() {
        var name = document.forms["service"]["txtName"].value;
        var registration = document.forms["service"]["txtregistration"].value;
        var company = document.forms["service"]["txtcompany"].value;
        var model = document.forms["service"]["txtmodel"].value;
        var chasis = document.forms["service"]["txtchasis"].value;
        var date = document.forms["service"]["txtdate"].value;
        var phone = document.forms["service"]["txtphone"].value;
        
        if (name === "" || registration === "" || company === "" || model === "" || chasis === "" || date === "" || phone === "") {
            alert("Please fill in all the fields");
        }
  		 else {
          alert("Thank you for reaching out. We will respond to your queries via the provided number: " +phone);
          // You can add further code here to submit the form data to a server or perform other actions.
        }
	}
	</script>

</body>
</html>
